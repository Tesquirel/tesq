<!-- Choose Us Start -->
<div
  class="section techwix-choose-us-section-02 section-padding-02 padding-top-bottom"
  style="background-image: url(assets/images/bg/choose-us-bg2.jpg)"
>
  <div class="container">
    <!-- Choose Us Wrap Start -->
    <div class="choose-us-wrap">
      <div class="row">
        <div class="col-lg-12">
          <!-- Choose Us Right Start -->
          <div class="choose-us-right">
            <!-- Faq Accordion Start -->
            <div class="faq-accordion">
              <div class="accordion" id="accordionExample">
                @for(story of allSuccessStories; track story){
                <div class="accordion-item">
                  <div class="accordion-header" id="heading-{{ $index }}">
                    <button
                      class="accordion-button collapsed"
                      type="button"
                      data-bs-toggle="collapse"
                      [attr.data-bs-target]="'#collapse-' + $index"
                      [attr.aria-expanded]="false"
                      [attr.aria-controls]="'collapse-' + $index"
                    >
                      <span class="title">{{ story.story_head }}</span>
                    </button>
                  </div>
                  <div
                    id="collapse-{{ $index }}"
                    class="accordion-collapse collapse"
                    [attr.aria-labelledby]="'heading-' + $index"
                    data-bs-parent="#accordionExample"
                  >
                    <!-- Remove 'show' class from the initial loop item IDs for proper collapse behavior, or handle it with logic if only one should be open at a time -->
                    <div class="accordion-body">
                      <h4>Story Quote</h4>
                      <p>
                        {{ story.story_quote }}
                      </p>
                      <h4>Benefits</h4>
                      <p>
                        {{ story.benefits }}
                      </p>
                      <h4>Brief</h4>
                      <p>
                        {{ story.story_brief }}
                      </p>
                      <h4>Challenge</h4>
                      <p>
                        {{ story.challenge }}
                      </p>
                      <h4>Solution</h4>
                      <p>
                        {{ story.solution }}
                      </p>
                    </div>
                  </div>
                </div>
                }
