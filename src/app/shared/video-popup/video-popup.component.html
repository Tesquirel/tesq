<dialog #videoDialog class="video-dialog">
  <button class="close-btn" (click)="close()">✕</button>
  @if(videoUrl){
  <iframe
    [src]="sanitizedUrl"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen
  >
  </iframe>
  }
</dialog>
