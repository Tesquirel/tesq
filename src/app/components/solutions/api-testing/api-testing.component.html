<main class="api-testing-page">

  <!-- ============ HERO (IMAGE) ============ -->
  <section class="hero">
    <div class="hero__inner">
      <div class="hero__media">
        <img
          [src]="heroImage"
          alt="TesQuire API Testing for Modern, Legacy and Hybrid Enterprises"
          loading="eager"
        />
      </div>
    </div>
  </section>

  <!-- ============ CHALLENGE / INTRO ============ -->
  <section class="section challenge">
    <div class="section__inner">
      <h2>{{ heroTitle }}</h2>
      <p>{{ heroDescription }}</p>
    </div>
    <!-- Button is now INSIDE the section to prevent gaps -->
    <div class="hero__cta">
      <a href="https://calendly.com/prasad-jwalapuram-tesquirel/30min" class="hero__button">Talk to an Expert</a>
    </div>
  </section>

  <!-- ============ WHY SECTION ============ -->
  <section class="section challenge">
    <div class="section__inner">
      <h2>{{ whyTitle }}</h2>
      <p>{{ whyDescription }}</p>
    </div>
  </section>

  <!-- ============ DETAILED FEATURE SECTIONS ============ -->
  <section class="section detail-sections">
    <div class="section__inner">
      <div *ngFor="let section of featureSections; let i = index" 
           class="detail-section" 
           [class.detail-section--alt]="i % 2 === 1"
           [class.detail-section--visible]="isVisible(i)">
        <div class="detail-section__content">
          <h2>{{ section.title }}</h2>
          <p>{{ section.description }}</p>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ FLOW IMAGE ============ -->
  <section class="section connected">
    <div class="section__inner">
      <div class="section__heading">
        <h2>API testing, connected end to end</h2>
      </div>
      <img
        [src]="flowImage"
        alt="Diagram of API testing connected to the enterprise journey"
        class="connected__figure"
      />
    </div>
  </section>

  <!-- ============ WHERE TESQUIRE FITS ============ -->
  <section class="section where-section">
    <div class="section__inner">
      <h2>{{ whereTitle }}</h2>
      <p>{{ whereDescription }}</p>
    </div>
  </section>

  <!-- ============ FAQ ============ -->
  <section class="section faq">
    <div class="section__inner">
      <div class="section__heading">
        <h2>Frequently Asked Questions?</h2>
      </div>

      <ul class="faq__list">
        <li *ngFor="let item of faqs; let i = index" class="faq__item" [class.faq__item--open]="isFaqOpen(i)">
          <button type="button" class="faq__question" [attr.aria-expanded]="isFaqOpen(i)" (click)="toggleFaq(i)">
            {{ item.question }}
            <svg class="faq__chevron" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>
          <p *ngIf="isFaqOpen(i)" class="faq__answer">{{ item.answer }}</p>
        </li>
      </ul>
    </div>
  </section>

</main>
