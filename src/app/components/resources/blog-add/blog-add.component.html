<!-- Blog Standard Start -->
<div class="section blog-standard-section section-padding-02">
  <div class="container">
    <!-- Blog Standard Wrap Start -->
    <div class="blog-standard-wrap">
      <div class="row">
        <div class="col-xl-12 col-lg-12">
          <div class="editor-container">
            <h2>Create a Blog</h2>

            <form [formGroup]="blogForm">
              <div class="row">
                <div class="col-sm-12">
                  <!-- Single Form Start -->
                  <div class="single-form">
                    <input
                      type="text"
                      placeholder="Title *"
                      formControlName="title"
                    />
                  </div>
                  <!-- Single Form End -->
                </div>
                <div class="col-sm-12">
                  <!-- Single Form Start -->
                  <div class="single-form">
                    <input
                      type="text"
                      placeholder="Category *"
                      formControlName="category"
                    />
                  </div>
                  <!-- Single Form End -->
                </div>
                <div class="col-sm-12">
                  <!-- Single Form Start -->
                  <div class="single-form">
                    <quill-editor
                      [modules]="modules"
                      theme="snow"
                      style="width: 100%; height: 100vh"
                      formControlName="content"
                    ></quill-editor>
                  </div>
                </div>
                <button class="btn" (click)="onSubmit()">Post the Blog</button>
              </div>
            </form>

            @if(this.blogForm.controls['content'].value){
            <h3>Preview (HTML):</h3>
            <div class="preview" [innerHTML]="content"></div>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
